name: Release to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pypi-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release version is new
        run: python scripts/check_release.py
      - run: python -m pip install '.[dev]'
      - run: ruff check src tests examples scripts
      - run: python -m pytest -q --cov=prism --cov-report=term --cov-fail-under=80
      - run: python -m pytest tests/standalone -q -m integration -o addopts=''
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mirrorneuron-prism/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
