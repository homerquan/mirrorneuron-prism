[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mirrorneuron-prism"
version = "0.2.0"
description = "Standalone, bounded, source-preserving OpenAI-compatible LLM proxy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Prism contributors"}]
keywords = ["llm", "proxy", "openai", "long-context", "inference", "laya"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anyio>=4.4,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "jsonschema>=4,<5",
  "laya>=0.3.23,<0.4",
]

[project.urls]
Homepage = "https://github.com/homerquan/mirrorneuron-prism"
Repository = "https://github.com/homerquan/mirrorneuron-prism"
Issues = "https://github.com/homerquan/mirrorneuron-prism/issues"

[project.optional-dependencies]
dev = [
  "build",
  "twine",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy",
  "httpx",
  "openai",
]

[project.scripts]
prism = "prism.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/tests", "/examples", "/models", "/prism.json", "/README.md", "/LICENSE", "/pyproject.toml", "/docs", "/prism_standalone_proxy_design.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: starts temporary local HTTP servers; no model weights or external services required"]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
